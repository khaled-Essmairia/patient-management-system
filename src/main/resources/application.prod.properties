spring.application.name=clinic
server.port=8081

# MySQL (the database is created automatically if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Shown in the sidebar and on invoices
clinic.name=Clinic Manager
clinic.currency=TND

# Public key of license-generator.html (the application can check licenses, never create them).
# If you create a new key pair in the generator, paste the new public key here.
clinic.license.public-key=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEWOQuHbbRMN2fb17+nfFsYjbO0HFDiB80E/W061jT4khz6zdSA7E6hpYtBV2+ChdmQJPiTrVFANXr3DifNtjKYg==

# CSV import
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


#Role	Username	Password
#Secretary	secretary	123456
#Doctor (dentist)	doctor1	123456

# ================= Language =================
# Default language of the screens: fr, ar or en (each user can switch it in the sidebar).
clinic.default-language=fr
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ================= Header of prescriptions, invoices and receipts =================
# The doctor's name, specialty and qualification come from the doctor profile screen.
clinic.address=
clinic.phone=
clinic.footer=

# ================= Daily database backup =================
# A backup (ZIP with a .sql file) is created once a day, also when the computer was off at night:
# the check runs every hour and one minute after start-up.
backup.enabled=true
backup.dir=./backups
# Optional second copy, for example a USB drive or a synchronised folder: backup.extra-dir=E:/clinic-backups
backup.extra-dir=
# Number of backups kept in each folder
backup.keep=30

# ================= SMS appointment reminders =================
# Works with any provider that has an HTTP API. {to}, {message} and {from} are replaced for each SMS.
sms.enabled=false
# Language of the SMS text: fr, ar or en
sms.language=fr
sms.reminder-hours-before=24
# No SMS is sent before / after these hours
sms.send-from-hour=8
sms.send-until-hour=20
sms.default-country-code=216
sms.from=
# --- example 1: provider with a simple URL (GET) ---
# sms.http.url=https://api.your-provider.tn/send?login=XXX&password=YYY&to={to}&text={message}
# sms.http.method=GET
# --- example 2: Twilio (replace the values; the header is "Basic" + base64 of AccountSID:AuthToken) ---
# sms.http.url=https://api.twilio.com/2010-04-01/Accounts/ACxxxxxxxx/Messages.json
# sms.http.method=POST
# sms.http.headers=Authorization: Basic BASE64_OF_SID_COLON_TOKEN
# sms.http.body=To={to}&From={from}&Body={message}
# sms.from=+1XXXXXXXXXX
# --- JSON providers: sms.http.content-type=application/json and sms.http.body={"to":"{to}","text":"{message}"} ---
# --- if the provider wants the number without "+": sms.strip-plus=true ---
