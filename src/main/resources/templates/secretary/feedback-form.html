<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${form.id == null ? 'Add feedback' : 'Update feedback'}, ~{::main})}">
<body>
<main>
    <div th:replace="~{fragments/parts :: formbar('fbForm', '/secretary/feedback', 'Feedback', '/secretary/feedback', ${form.id == null ? 'Add feedback' : 'Update feedback'})}"></div>
    <h1 class="page-title">[[#{t.feedback}]]</h1>
    <h2 class="subtitle" th:text="${@tr.t(form.id == null ? 'New Feedback' : 'Update Feedback')}"></h2>
    <form id="fbForm" class="doc-form" th:action="@{/secretary/feedback}" th:object="${form}" method="post">
        <div th:replace="~{fragments/parts :: errors}"></div>
        <input type="hidden" th:field="*{id}">
        <div class="kv-row">
            <table class="kv">
                <tr><td class="k">[[#{t.patient}]] <i>*</i></td><td><select th:field="*{patientId}" required>
                    <option value="">[[#{t.select_patient}]]</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName + ' (' + p.ref + ')'}"></option></select></td></tr>
                <tr><td class="k">[[#{t.rating}]] <i>*</i></td><td><select th:field="*{rating}">
                    <option value="5">[[#{t.5_excellent}]]</option><option value="4">[[#{t.4_good}]]</option><option value="3">[[#{t.3_average}]]</option>
                    <option value="2">[[#{t.2_poor}]]</option><option value="1">[[#{t.1_very_poor}]]</option></select></td></tr>
            </table>
        </div>
        <table class="kv note-row">
            <tr><td class="k" style="width:120px">[[#{t.comment}]]</td><td><textarea th:field="*{comment}" rows="4" maxlength="1000"></textarea></td></tr>
        </table>
        <button type="submit" class="btn success">&#10003; [[#{t.save}]]</button>
        <a class="btn ghost" th:href="@{/secretary/feedback}">[[#{t.cancel}]]</a>
    </form>
</main>
</body>
</html>
