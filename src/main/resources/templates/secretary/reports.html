<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Reports', ~{::main})}">
<body>
<main>
    <div class="page-head"><div><h1>[[#{t.reports}]]</h1><p>[[#{t.medical_reports_written_by_the_doctors_after_each_appointment}]]</p></div></div>
    <div class="card table-wrap" data-paged>
        <table class="list">
            <thead><tr><th>[[#{t.date}]]</th><th>[[#{t.patient}]]</th><th>[[#{t.diagnosis}]]</th><th></th></tr></thead>
            <tbody th:each="r : ${rows}" data-row>
            <tr>
                <td th:text="${@fmt.dateTime(r.createdAt)}"></td>
                <td><a th:href="@{/secretary/patients/{id}(id=${r.patient.id})}" th:text="${r.patient.fullName}"></a></td>
                <td th:text="${r.diagnosis}"></td>
                <td class="actions">
                    <button type="button" class="btn small ghost" data-toggle-detail>[[#{t.view}]]</button>
                    <a class="btn small ghost" th:href="@{/secretary/reports/{id}/edit(id=${r.id})}">[[#{t.update}]]</a>
                    <form th:action="@{/secretary/reports/{id}/delete(id=${r.id})}" method="post" th:attr="data-confirm=#{t.delete_this_report}">
                        <button class="btn small danger" type="submit">[[#{t.delete}]]</button></form>
                </td>
            </tr>
            <tr class="detail" hidden><td colspan="4"><div class="detail-grid">
                <div><b>[[#{t.appointment}]]</b><span th:text="${@fmt.dateTime(r.appointment.appointmentDateTime)}"></span></div>
                <div><b>[[#{t.medicine_prescribed}]]</b><span th:text="${r.medicinePrescribed ?: '-'}"></span></div>
                <div><b>[[#{t.doctor_s_comment}]]</b><span th:text="${r.doctorComment ?: '-'}"></span></div>
            </div></td></tr>
            </tbody>
            <tbody th:if="${#lists.isEmpty(rows)}"><tr><td colspan="4" class="empty-note">[[#{t.no_report_yet}]]</td></tr></tbody>
        </table>
    </div>
</main>
</body>
</html>
