<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('My appointments', ~{::main})}">
<body>
<main>
    <div class="page-head"><div><h1>[[#{t.my_appointments}]]</h1><p>[[#{t.only_your_own_appointments_are_shown_here}]]</p></div></div>
    <form class="toolbar" method="get" th:action="@{/doctor/appointments}">
        <select name="when">
            <option value="today" th:selected="${when == 'today'}">[[#{t.today}]]</option>
            <option value="upcoming" th:selected="${when == 'upcoming'}">[[#{t.today_and_upcoming}]]</option>
            <option value="past" th:selected="${when == 'past'}">[[#{t.past}]]</option>
            <option value="all" th:selected="${when == 'all'}">[[#{t.all}]]</option>
        </select>
        <select name="status"><option value="">[[#{t.all_statuses}]]</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${@tr.t(s.label)}" th:selected="${status == s}"></option></select>
        <button class="btn ghost" type="submit">[[#{t.filter}]]</button>
    </form>
    <div class="card table-wrap" data-paged>
        <table class="list">
            <thead><tr><th>[[#{t.date_time}]]</th><th>[[#{t.patient}]]</th><th>[[#{t.age}]]</th><th>[[#{t.reason}]]</th><th>[[#{t.status}]]</th><th></th></tr></thead>
            <tbody th:each="a : ${rows}" data-row>
            <tr>
                <td th:text="${@fmt.dateTime(a.appointmentDateTime)}"></td>
                <td th:text="${a.patient.fullName}"></td>
                <td th:text="${a.patient.age}"></td>
                <td th:text="${a.reason ?: '-'}"></td>
                <td><span class="badge" th:classappend="'s-' + ${a.status.name().toLowerCase()}" th:text="${@tr.t(a.status.label)}"></span></td>
                <td class="actions">
                    <button type="button" class="btn small ghost" data-toggle-detail>[[#{t.patient_info}]]</button>
                    <a th:if="${a.status.name() != 'CANCELLED'}" class="btn small" th:href="@{/doctor/appointments/{id}/report(id=${a.id})}"
                       th:text="${@tr.t(reportedIds.contains(a.id) ? 'Edit report' : 'Write report')}">Write report</a>
                </td>
            </tr>
            <tr class="detail" hidden><td colspan="6"><div class="detail-grid">
                <div><b>[[#{t.gender}]]</b><span th:text="${a.patient.gender == 'M' ? @tr.t('Male') : (a.patient.gender == 'F' ? @tr.t('Female') : '-')}"></span></div>
                <div><b>[[#{t.phone}]]</b><span th:text="${a.patient.contactNumber}"></span></div>
                <div><b>[[#{t.notes}]]</b><span th:text="${a.patient.notes ?: '-'}"></span></div>
            </div></td></tr>
            </tbody>
            <tbody th:if="${#lists.isEmpty(rows)}"><tr><td colspan="6" class="empty-note">[[#{t.no_appointment_found}]]</td></tr></tbody>
        </table>
    </div>
</main>
</body>
</html>
